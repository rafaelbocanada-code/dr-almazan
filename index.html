<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Dr. Augusto René Almazán Corral, traumatólogo y ortopedista en Monterrey. Contacto por WhatsApp, teléfono y ubicación.">
<title>Tarjeta Dr. Almazán</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap">
<style>
/* Concepto: tarjeta de contacto móvil. Un retrato en video que pasa de sombra a luz; el texto cambia de blanco a tinta azul marino al ritmo de la luz. */
:root {
  --stage: #dfe5ea;
  --stage-shadow: 0 30px 80px rgba(20, 36, 52, .22);
  --serif: "Instrument Serif", "Times New Roman", serif;
  --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;

  /* Paleta de la tarjeta (mismo look en claro y oscuro) */
  --c-top: #64707e;
  --c-mid: #8395a3;
  --c-light: #dae4eb;
  --c-ink: #0e1620;
  --c-ink-2: rgba(14, 22, 32, .62);
  --c-line: rgba(14, 22, 32, .14);
  --c-wa: #0f7a55;
  --c-white: #ffffff;

  /* Los fija el script según el avance del video */
  --ink: rgb(255, 255, 255);
  --ink-soft: rgba(255, 255, 255, .72);
  --ink-line: rgba(255, 255, 255, .55);

  --ease: cubic-bezier(.2, .8, .2, 1);
  --spring: cubic-bezier(.34, 1.56, .64, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --stage: #0f151b; --stage-shadow: 0 30px 80px rgba(0, 0, 0, .55); color-scheme: dark; }
}
:root[data-theme="dark"] { --stage: #0f151b; --stage-shadow: 0 30px 80px rgba(0, 0, 0, .55); color-scheme: dark; }

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--stage); color: var(--c-ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; -webkit-tap-highlight-color: transparent; }

.stage { min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; }
.card {
  position: relative; width: 100%; max-width: 430px; overflow: hidden; isolation: isolate;
  background: linear-gradient(180deg, var(--c-top) 0%, var(--c-mid) 38%, #c2cfda 56%, var(--c-light) 68%, var(--c-light) 100%);
}
@media (min-width: 520px) {
  .stage { padding: 32px 0; }
  .card { border-radius: 34px; box-shadow: var(--stage-shadow); }
}

/* ---------- Retrato en video ---------- */
.hero { position: absolute; inset: 0 0 auto 0; height: 500px; overflow: hidden; z-index: 0;
  -webkit-mask-image: linear-gradient(to bottom, #000 82%, transparent 100%); mask-image: linear-gradient(to bottom, #000 82%, transparent 100%); }
.hero-shift { position: absolute; inset: -14px; transform: translate3d(calc(var(--mx, 0) * -7px), calc(var(--my, 0) * -5px), 0); transition: transform .5s var(--ease); }
.hero-shift { background: linear-gradient(180deg, var(--h0, #64707e) 0%, var(--h1, #8395a3) 48%, var(--h2, #697784) 100%); }
.hero video, .hero .poster { position: absolute; top: 14px; left: 19%; width: 102%; height: auto; display: block;
  -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 44px); mask-image: linear-gradient(90deg, transparent 0, #000 44px); }
.hero video { transform-origin: 38% 22%; animation: kenburns 5.4s var(--ease) both; }
.hero .poster { opacity: 1; }

/* ---------- Contenido ---------- */
.content { position: relative; z-index: 2; padding-block: 24px 30px;
  padding-left: max(25px, env(safe-area-inset-left, 0px)); padding-right: max(25px, env(safe-area-inset-right, 0px)); }
.top { min-height: 404px; display: flex; flex-direction: column; }
.bar { display: flex; align-items: center; justify-content: space-between; min-height: 38px; }
.logo { font-family: var(--serif); font-size: 26px; line-height: 1; color: var(--ink); letter-spacing: .005em; }
.pill { display: inline-flex; align-items: center; gap: 7px; height: 38px; padding: 0 18px; border-radius: 999px; border: 1px solid var(--ink-line); color: var(--ink); font-size: 14px; font-weight: 500;
  background: rgba(255, 255, 255, .04); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); transition: background .25s, transform .25s var(--ease); }
.pill:hover { background: rgba(255, 255, 255, .16); }
.eyebrow { margin: 26px 0 0; font-size: 10.5px; font-weight: 500; letter-spacing: .035em; text-transform: uppercase; color: var(--ink); }
.name { margin: 22px 0 0; max-width: 205px; font-family: var(--serif); font-weight: 400; font-size: 43px; line-height: .98; letter-spacing: -.005em; color: var(--ink); }
.name .last { color: var(--ink-soft); }
.w { display: inline-block; overflow: hidden; vertical-align: top; padding: .14em .04em .12em 0; margin: -.14em 0 -.12em; }
.wi { display: inline-block; will-change: transform; }

.wa { position: relative; display: block; margin-top: 0; padding: 17px 18px 17px; min-height: 118px; border-radius: 22px; overflow: hidden;
  background: rgba(255, 255, 255, .34); border: 1px solid rgba(255, 255, 255, .62);
  -webkit-backdrop-filter: blur(16px) saturate(1.2); backdrop-filter: blur(16px) saturate(1.2);
  box-shadow: 0 10px 30px rgba(24, 44, 64, .12), inset 0 1px 0 rgba(255, 255, 255, .7); transition: transform .35s var(--ease), box-shadow .35s; }
.wa:active { transform: scale(.975); }
.wa-label { font-size: 13px; color: var(--c-ink-2); }
.wa-title { margin: 6px 0 0; font-size: 19px; line-height: 1.2; font-weight: 600; letter-spacing: -.01em; color: var(--c-ink); }
.typed { position: relative; margin-top: 10px; max-width: 100%; font-size: 13px; line-height: 1.45; color: var(--c-ink-2); }
.typed .ghost { visibility: hidden; display: block; }
.typed .live { position: absolute; inset: 0; display: block; }
.wa-go { position: absolute; top: 17px; right: 17px; width: 46px; height: 46px; border-radius: 15px; display: grid; place-items: center; background: var(--c-white); color: var(--c-wa);
  box-shadow: 0 6px 16px rgba(20, 40, 60, .14); }
.wa-go svg { transition: transform .35s var(--ease); }
.wa:hover .wa-go svg { transform: translate(2px, -2px); }
.wa-go::after { content: ""; position: absolute; inset: 0; border-radius: 15px; box-shadow: 0 0 0 0 rgba(15, 122, 85, .35); animation: ring 3.4s ease-out 4.2s infinite; }
.wa::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 35%, rgba(255, 255, 255, .55) 50%, transparent 65%); transform: translateX(-120%); animation: sheen 1.5s var(--ease) 2.5s 1 both; pointer-events: none; }

.row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
.btn { display: grid; place-items: center; height: 54px; border-radius: 18px; background: rgba(255, 255, 255, .92); color: var(--c-ink); font-size: 16px; font-weight: 500;
  box-shadow: 0 8px 20px rgba(24, 44, 64, .08), inset 0 1px 0 #fff; transition: transform .3s var(--ease); }
.btn:active, .site:active, .pill:active { transform: scale(.96); }

.info { margin-top: 14px; padding: 20px; border-radius: 24px; border: 1px solid var(--c-line); background: rgba(255, 255, 255, .2); }
.info p { margin: 0; font-size: 16px; line-height: 1.45; color: #18222c; text-wrap: balance; }
.site { position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; gap: 7px; height: 56px; margin-top: 16px; border-radius: 14px; background: #000; color: #fff; font-size: 16px; font-weight: 500; transition: transform .3s var(--ease); }
.site::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 35%, rgba(255, 255, 255, .22) 50%, transparent 65%); transform: translateX(-120%); animation: sheen 1.4s var(--ease) 3.1s 1 both; }

.foot { margin: 22px 0 0; text-align: center; font-size: 12px; line-height: 1.65; color: #44505b; }
.foot p { margin: 0; text-wrap: balance; }
.foot .where { margin-bottom: 4px; }

a:focus-visible { outline: 2px solid var(--c-ink); outline-offset: 3px; }
.logo-link:focus-visible, .pill:focus-visible { outline-color: var(--ink); }

/* ---------- Secuencia de entrada ---------- */
.up { animation: up .9s var(--ease) var(--d, 0s) both; }
.wi { animation: word 1.05s var(--ease) var(--d, 0s) both; }
.glass-in { animation: glass 1.1s var(--ease) var(--d, 0s) both; }
.pop { animation: pop .8s var(--spring) var(--d, 0s) both; }
@keyframes up { from { opacity: 0; transform: translateY(14px); filter: blur(6px); } to { opacity: 1; transform: none; filter: blur(0); } }
@keyframes word { from { transform: translateY(112%) rotate(4deg); } to { transform: none; } }
@keyframes glass { from { opacity: 0; transform: translateY(30px) scale(.97); filter: blur(10px); } to { opacity: 1; transform: none; filter: blur(0); } }
@keyframes pop { from { opacity: 0; transform: scale(.4) rotate(-12deg); } to { opacity: 1; transform: none; } }
@keyframes kenburns { from { transform: scale(1.12) translateY(-8px); } to { transform: scale(1) translateY(0); } }
@keyframes sheen { from { transform: translateX(-120%); } to { transform: translateX(120%); } }
@keyframes ring { 0% { box-shadow: 0 0 0 0 rgba(15, 122, 85, .35); } 60%, 100% { box-shadow: 0 0 0 14px rgba(15, 122, 85, 0); } }

@media (prefers-reduced-motion: reduce) {
  .up, .wi, .glass-in, .pop, .hero video, .wa::after, .site::after, .wa-go::after { animation: none !important; }
  .hero-shift { transition: none; }
}
</style>

</head>
<body>
<main class="stage">
  <article class="card" id="card">
    <div class="hero" aria-hidden="true">
      <div class="hero-shift">
        <img class="poster" id="poster" alt="" src="media/poster.jpg">
        <video id="vid" muted playsinline preload="auto" poster="media/poster.jpg" disablepictureinpicture>
          <source src="media/doctor.mp4" type="video/mp4">
          <source src="media/doctor.webm" type="video/webm">
        </video>
      </div>
    </div>

    <div class="content">
      <div class="top">
        <header class="bar">
          <a class="logo logo-link up" style="--d:.1s" data-k="shortName" href="#"></a>
          <a class="pill up" style="--d:.2s" data-k-href="siteUrl" href="#"><span data-k="siteLabel"></span><svg width="11" height="11" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M3 9L9 3M4 3h5v5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
        </header>
        <p class="eyebrow up" style="--d:.35s" data-k="eyebrow"></p>
        <h1 class="name" id="name" aria-label=""></h1>
      </div>

      <a class="wa glass-in" id="wa" style="--d:1.45s" data-k-href="waHref" target="_blank" rel="noopener">
        <div class="wa-label" data-k="waLabel"></div>
        <div class="wa-title" data-k="waTitle"></div>
        <div class="typed" id="typed"><span class="ghost" id="ghost"></span><span class="live" id="live" aria-hidden="true"></span></div>
        <span class="wa-go pop" style="--d:1.9s" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 12 12" fill="none"><path d="M3 9L9 3M4 3h5v5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      </a>

      <div class="row">
        <a class="btn up" style="--d:1.75s" data-k="callLabel" data-k-href="callHref"></a>
        <a class="btn up" style="--d:1.85s" data-k="mapLabel" data-k-href="mapHref" target="_blank" rel="noopener"></a>
      </div>

      <section class="info up" style="--d:2s">
        <p data-k="infoText"></p>
        <a class="site" data-k-href="siteUrl"><span data-k="siteButton"></span><svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M3 9L9 3M4 3h5v5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
      </section>

      <footer class="foot up" style="--d:2.4s">
        <p class="where" data-k="where"></p>
        <p data-k="cedulas"></p>
        <p data-k="urgency"></p>
      </footer>
    </div>
  </article>
</main>

<script>
/* ============ CONFIG: lo único que cambia de un doctor a otro ============ */
const CONFIG = {
  shortName: "Dr. Almazán",
  nameFirst: "Dr. Augusto René",
  nameLast: "Almazán Corral",
  eyebrow: "Traumatología y ortopedia",
  siteLabel: "Sitio web",
  siteButton: "Ver sitio web",
  siteUrl: "#sitio",                              // pendiente: URL real del sitio
  waLabel: "WhatsApp",
  waTitle: "Escribir por WhatsApp",
  waNumber: "528110514600",                       // por confirmar que tenga WhatsApp
  waMessage: "Hola, Dr. Almazán. Me gustaría agendar una consulta. Mi motivo de consulta es: ",
  callLabel: "Llamar",
  callNumber: "+528181228122,6574",               // consultorio, ext. 6574
  mapLabel: "Cómo llegar",
  mapQuery: "CHRISTUS MUGUERZA Hospital Conchita, 15 de Mayo 1822, Nuevo Obispado, Monterrey, N.L.",
  infoText: "Conoce mi trayectoria, casos clínicos y los padecimientos que atiendo.",
  where: "Consultorio 1 (Lobby) · Hospital Conchita, Monterrey, N.L.",
  cedulas: "Cédulas profesionales 4409177 y 5573884",
  urgency: "En caso de urgencia, acude al servicio de urgencias más cercano.",
  video: { inkFrom: 1.6, inkTo: 2.6 }             // segundos del video en que el texto pasa de blanco a tinta
};

/* ============ Render ============ */
const $ = (s) => document.querySelector(s);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const hrefs = {
  siteUrl: CONFIG.siteUrl,
  waHref: "https://wa.me/" + CONFIG.waNumber + "?text=" + encodeURIComponent(CONFIG.waMessage),
  callHref: "tel:" + CONFIG.callNumber,
  mapHref: "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(CONFIG.mapQuery)
};
document.querySelectorAll("[data-k]").forEach((el) => { if (CONFIG[el.dataset.k] != null) el.textContent = CONFIG[el.dataset.k]; });
document.querySelectorAll("[data-k-href]").forEach((el) => { el.setAttribute("href", hrefs[el.dataset.kHref] || CONFIG[el.dataset.kHref]); });
document.querySelectorAll('a[href="#sitio"], a[href="#"]').forEach((a) => a.addEventListener("click", (e) => e.preventDefault()));

/* Nombre: cada palabra sube desde una máscara */
(function buildName() {
  const h = $("#name"); h.setAttribute("aria-label", CONFIG.nameFirst + " " + CONFIG.nameLast);
  let i = 0;
  const add = (text, cls) => text.split(" ").forEach((word) => {
    const w = document.createElement("span"); w.className = "w" + (cls ? " " + cls : "");
    const inner = document.createElement("span"); inner.className = "wi"; inner.textContent = word;
    inner.style.setProperty("--d", (0.5 + i * 0.1).toFixed(2) + "s"); i++;
    w.appendChild(inner); h.appendChild(w); h.appendChild(document.createTextNode(" "));
  });
  add(CONFIG.nameFirst); const last = document.createElement("span"); last.className = "last"; h.appendChild(last);
  const start = h.childNodes.length;
  add(CONFIG.nameLast);
  while (h.childNodes.length > start) last.appendChild(h.childNodes[start]);
})();

/* Mensaje prellenado: se escribe solo */
(function typeMessage() {
  const full = "“" + CONFIG.waMessage.trim() + "”";
  $("#ghost").textContent = full; const live = $("#live");
  $("#wa").setAttribute("aria-label", CONFIG.waTitle + ". " + full);
  if (reduce) { live.textContent = full; return; }
  let n = 0; const start = performance.now() + 2100;
  (function step(now) {
    if (now < start) return requestAnimationFrame(step);
    n = Math.min(full.length, Math.floor((now - start) / 22));
    live.textContent = full.slice(0, n);
    if (n < full.length) requestAnimationFrame(step);
  })(performance.now());
})();

/* Video: se reproduce una vez y se queda en el último cuadro. El texto cambia de tinta con la luz. */
const vid = $("#vid"), poster = $("#poster"), root = document.documentElement;
const A = [255, 255, 255], B = [13, 26, 38];
const smooth = (p) => p * p * (3 - 2 * p);
function setInk(p) {
  const c = A.map((a, i) => Math.round(a + (B[i] - a) * p)).join(",");
  root.style.setProperty("--ink", "rgb(" + c + ")");
  root.style.setProperty("--ink-soft", "rgba(" + c + ",.72)");
  root.style.setProperty("--ink-line", "rgba(" + c + ",.55)");
}
/* Relleno del borde izquierdo: sigue el color del fondo del video mientras se enciende la luz */
const H0 = [[100, 112, 126], [135, 153, 167]], H1 = [[131, 149, 163], [160, 178, 192]], H2 = [[105, 119, 132], [179, 192, 201]];
const mix = (pair, p) => pair[0].map((a, i) => Math.round(a + (pair[1][i] - a) * p)).join(",");
function setLight(p) {
  root.style.setProperty("--h0", "rgb(" + mix(H0, p) + ")");
  root.style.setProperty("--h1", "rgb(" + mix(H1, p) + ")");
  root.style.setProperty("--h2", "rgb(" + mix(H2, p) + ")");
}
function tick() {
  const { inkFrom, inkTo } = CONFIG.video, t = vid.currentTime;
  setInk(smooth(Math.min(1, Math.max(0, (t - inkFrom) / (inkTo - inkFrom)))));
  setLight(Math.min(1, t / 3.1));
  if (!vid.ended) requestAnimationFrame(tick); else { setInk(1); setLight(1); }
}
vid.addEventListener("playing", () => { poster.style.display = "none"; requestAnimationFrame(tick); });
vid.addEventListener("ended", () => { setInk(1); setLight(1); });
if (reduce) {
  vid.addEventListener("loadedmetadata", () => { vid.currentTime = Math.max(0, vid.duration - 0.05); poster.style.display = "none"; setInk(1); setLight(1); });
} else {
  const go = () => vid.play().catch(() => {
    const once = () => { vid.play().catch(() => {}); removeEventListener("pointerdown", once); };
    addEventListener("pointerdown", once, { once: true });
  });
  go();
}

/* Paralaje suave con el puntero (solo escritorio) */
if (matchMedia("(pointer: fine)").matches && !reduce) {
  addEventListener("pointermove", (e) => {
    root.style.setProperty("--mx", ((e.clientX / innerWidth) - .5).toFixed(3));
    root.style.setProperty("--my", ((e.clientY / innerHeight) - .5).toFixed(3));
  });
}
</script>
</body>
</html>
